name: Release

# release-please keeps a release pull request open from the commits on master.
# Merging it tags vX.Y.Z and opens a draft release; the jobs below build the
# desktop installers, attach them with SHA256SUMS and publish the draft, so a
# release is never visible without its installers. Each runner builds the Tauri
# app's installer and, as a preview, the Slint app's (apps/slint), and signs the
# files the apps' updaters install (see "Updater files").
#
# A manual run builds every installer without releasing anything; give it a
# tag to rebuild and replace the installers of that existing release.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release to rebuild (vX.Y.Z); empty builds only"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.name }}
    needs: release-please
    # always(): a manual run skips release-please, which would skip this too.
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
            bundle: nsis
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            pdfium: mac-arm64
            bundle: dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            pdfium: mac-x64
            bundle: dmg
          # The oldest supported Ubuntu, so the packages run on older glibc too. The
          # .deb and .rpm use the system's WebKitGTK; the AppImage bundles it for any
          # other distribution.
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
            bundle: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    # id-token and attestations: write let the job sign build provenance for its installers.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}

      - name: Tag matches Cargo.toml
        if: env.TAG != ''
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$TAG" || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libfontconfig1-dev libxkbcommon-dev patchelf

      # rustup reads the pinned toolchain from rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      - name: Fetch PDFium
        if: runner.os != 'Windows'
        run: ./scripts/fetch-pdfium.sh ${{ matrix.pdfium }}
      - name: Fetch PDFium
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1 -Platform ${{ matrix.pdfium }}

      - name: Build installer
        working-directory: apps/tauri
        shell: bash
        env:
          # No Apple Developer ID yet: sign ad hoc, so Gatekeeper offers "Open Anyway"
          # instead of calling the downloaded app damaged.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # On macOS the .app bundle too: Tauri deletes it after making the DMG unless
          # it was asked for, and "Updater files" archives it.
          BUNDLES: ${{ matrix.bundle }}${{ runner.os == 'macOS' && ',app' || '' }}
        run: |
          npm ci
          npx tauri build --ci --target ${{ matrix.target }} --bundles "$BUNDLES"

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # The Slint app as a preview. cargo-packager reads its settings from
      # apps/slint/Cargo.toml, which takes PDFium from target/slint-pdfium. On macOS
      # it signs only with the identity in that config and there is no Developer ID yet,
      # so the app bundle is signed ad hoc here, as the Tauri build is, then put in a DMG.
      - name: Build Slint installer
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PDFIUM: vendor/pdfium/${{ matrix.pdfium }}
          # linuxdeploy's AppImage plugin is itself an AppImage, and without FUSE it
          # fails with exit code 127 unless it unpacks itself instead (Tauri does this).
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          case "$RUNNER_OS" in
            Windows) lib="$PDFIUM/bin/pdfium.dll" ;;
            macOS) lib="$PDFIUM/lib/libpdfium.dylib" ;;
            *) lib="$PDFIUM/lib/libpdfium.so" ;;
          esac
          mkdir -p target/slint-pdfium
          cp "$lib" "$PDFIUM/LICENSE" target/slint-pdfium/
          cargo build -p nuprint-slint --release --locked --target "$TARGET"
          release="target/$TARGET/release"
          if [ "$RUNNER_OS" != macOS ]; then
            # cargo-packager makes no .rpm; the AppImage covers Fedora and the rest.
            formats=${{ matrix.bundle }}
            [ "$RUNNER_OS" = Linux ] && formats=deb,appimage
            cargo packager -p nuprint-slint --release --target "$TARGET" -f "$formats"
            exit 0
          fi
          cargo packager -p nuprint-slint --release --target "$TARGET" -f app
          codesign --force --deep --sign - "$release/NuPrint Slint.app"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          arch=${TARGET%%-*}
          [ "$arch" = x86_64 ] && arch=x64
          mkdir -p target/slint-dmg
          cp -R "$release/NuPrint Slint.app" target/slint-dmg/
          ln -s /Applications target/slint-dmg/Applications
          hdiutil create -volname "NuPrint Slint" -srcfolder target/slint-dmg -ov -format UDZO \
            "$release/nuprint-slint_${version}_${arch}.dmg"

      - name: Stage
        shell: bash
        run: |
          mkdir dist
          release="target/${{ matrix.target }}/release"
          bundle="$release/bundle"
          case "$RUNNER_OS" in
            Windows) cp "$bundle"/nsis/*-setup.exe "$release"/nuprint-slint_*-setup.exe dist/ ;;
            macOS) cp "$bundle"/dmg/*.dmg "$release"/nuprint-slint_*.dmg dist/ ;;
            Linux)
              cp "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage dist/
              cp "$release"/nuprint-slint_*.deb "$release"/nuprint-slint_*.AppImage dist/ ;;
          esac
          ls -l dist

      # Each app checks a manifest on the latest release (latest.json for the Tauri
      # app, latest-slint.json for the Slint app) and installs a file it lists only
      # when that file's signature matches the public key built into the app. The key
      # pair is the maintainer's; its private half is in the repository's secrets.
      # The installer is the update file, except on macOS, where the updaters replace
      # the .app bundle and so get an archive of it. On Linux the Tauri updater looks
      # for the entry of the package it was installed from (linux-x86_64-deb, -rpm or
      # -appimage) before plain linux-x86_64, which stays the .deb for older installs.
      # The Slint app cannot install on Linux; its entry only tells it a release
      # exists. This writes this platform's entries to updates/, and the publish job
      # joins them.
      - name: Updater files
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set"; exit 1; }
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          release="target/$TARGET/release"
          arch=${TARGET%%-*}
          mkdir updates
          # `tauri` lists the Tauri app's entries as key=file.
          case "$RUNNER_OS" in
            Windows)
              slint_key=windows-$arch; slint_format=nsis; slint=$(ls dist/nuprint-slint_*-setup.exe)
              tauri="windows-$arch=$(ls dist/NuPrint_*-setup.exe)" ;;
            Linux)
              slint_key=linux-$arch; slint_format=appimage; slint=$(ls dist/nuprint-slint_*.AppImage)
              deb=$(ls dist/NuPrint_*.deb)
              tauri="linux-$arch=$deb linux-$arch-deb=$deb linux-$arch-rpm=$(ls dist/NuPrint*.rpm) linux-$arch-appimage=$(ls dist/NuPrint_*.AppImage)" ;;
            macOS)
              slint_key=macos-$arch; slint_format=app
              short=$arch; [ "$short" = x86_64 ] && short=x64
              slint="dist/nuprint-slint_${version}_${short}.app.tar.gz"
              tauri="darwin-$arch=dist/NuPrint_${version}_${short}.app.tar.gz"
              COPYFILE_DISABLE=1 tar -czf "${tauri#*=}" -C "$release/bundle/macos" NuPrint.app
              COPYFILE_DISABLE=1 tar -czf "$slint" -C "$release" "NuPrint Slint.app" ;;
          esac
          # Each file once: the .deb serves two Linux entries.
          files="$slint"
          for pair in $tauri; do
            case " $files " in *" ${pair#*=} "*) ;; *) files="$files ${pair#*=}" ;; esac
          done
          for file in $files; do
            (cd apps/tauri && npx tauri signer sign --app-version "$version" "$GITHUB_WORKSPACE/$file")
          done
          node -e '
            const fs = require("fs");
            const [, slintKey, slintFormat, slint, ...tauri] = process.argv;
            const entry = (key, file) => ({ key, file: file.split("/").pop(), signature: fs.readFileSync(file + ".sig", "utf8").trim() });
            fs.writeFileSync(`updates/${slintKey}.json`, JSON.stringify({
              tauri: tauri.map((pair) => entry(...pair.split("="))),
              slint: [{ ...entry(slintKey, slint), format: slintFormat }],
            }));
          ' "$slint_key" "$slint_format" "$slint" $tauri
          rm dist/*.sig
          cat updates/*.json

      # Signed build provenance, free for public repositories: anyone can check that an
      # installer was built by this workflow from this repository with
      # `gh attestation verify <file> --repo wapenshaw/nuprint`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.target }}
          path: dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: updates-${{ matrix.target }}
          path: updates/*

  publish:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success' && (needs.release-please.outputs.created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: updates-*
          path: updates
          merge-multiple: true
      # The update manifests the apps check, with each platform's file and signature
      # and the release notes release-please wrote, which the apps show.
      - name: Update manifests
        run: |
          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > notes.md
          node -e '
            const fs = require("fs");
            const { TAG, GITHUB_REPOSITORY } = process.env;
            const base = `https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/`;
            const manifest = { version: TAG.replace(/^v/, ""), notes: fs.readFileSync("notes.md", "utf8"), pub_date: new Date().toISOString() };
            const apps = { tauri: { ...manifest, platforms: {} }, slint: { ...manifest, platforms: {} } };
            for (const name of fs.readdirSync("updates")) {
              const platform = JSON.parse(fs.readFileSync(`updates/${name}`, "utf8"));
              for (const [app, entries] of Object.entries(platform)) {
                for (const { key, file, ...rest } of entries) {
                  apps[app].platforms[key] = { ...rest, url: base + encodeURIComponent(file) };
                }
              }
            }
            fs.writeFileSync("dist/latest.json", JSON.stringify(apps.tauri, null, 2));
            fs.writeFileSync("dist/latest-slint.json", JSON.stringify(apps.slint, null, 2));
          '
          cat dist/latest.json dist/latest-slint.json
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attach and publish
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  # nuprint.app links to the newest published release and shows its changelog;
  # redeploy it now that this one is out.
  site:
    needs: publish
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
