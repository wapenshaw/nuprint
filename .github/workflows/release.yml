name: Release

# release-please keeps a release pull request open from the commits on master.
# Merging it tags vX.Y.Z and opens a draft release; the jobs below build the
# desktop installers, attach them with SHA256SUMS and publish the draft, so a
# release is never visible without its installers. Each runner builds the Tauri
# app's installer and, as a preview, the Slint app's (apps/slint-demo).
#
# A manual run builds every installer without releasing anything; give it a
# tag to rebuild and replace the installers of that existing release.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release to rebuild (vX.Y.Z); empty builds only"
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.name }}
    needs: release-please
    # always(): a manual run skips release-please, which would skip this too.
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            pdfium: win-x64
            bundle: nsis
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            pdfium: mac-arm64
            bundle: dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            pdfium: mac-x64
            bundle: dmg
          # The oldest supported Ubuntu, so the .deb installs on older glibc too.
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            pdfium: linux-x64
            bundle: deb
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.sha }}

      - name: Tag matches Cargo.toml
        if: env.TAG != ''
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test "v$version" = "$TAG" || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libfontconfig1-dev libxkbcommon-dev

      # rustup reads the pinned toolchain from rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Fetch PDFium
        if: runner.os != 'Windows'
        run: ./scripts/fetch-pdfium.sh ${{ matrix.pdfium }}
      - name: Fetch PDFium
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1 -Platform ${{ matrix.pdfium }}

      - name: Build installer
        working-directory: apps/desktop
        shell: bash
        env:
          # No Apple Developer ID yet: sign ad hoc, so Gatekeeper offers "Open Anyway"
          # instead of calling the downloaded app damaged.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: |
          npm ci
          npx tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      # The Slint app as a preview. cargo-packager reads its settings from
      # apps/slint-demo/Cargo.toml, which takes PDFium from target/slint-pdfium. On macOS
      # it signs only with the identity in that config and there is no Developer ID yet,
      # so the app bundle is signed ad hoc here, as the Tauri build is, then put in a DMG.
      - name: Build Slint installer
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PDFIUM: vendor/pdfium/${{ matrix.pdfium }}
        run: |
          case "$RUNNER_OS" in
            Windows) lib="$PDFIUM/bin/pdfium.dll" ;;
            macOS) lib="$PDFIUM/lib/libpdfium.dylib" ;;
            *) lib="$PDFIUM/lib/libpdfium.so" ;;
          esac
          mkdir -p target/slint-pdfium
          cp "$lib" "$PDFIUM/LICENSE" target/slint-pdfium/
          cargo build -p nuprint-slint-demo --release --locked --target "$TARGET"
          release="target/$TARGET/release"
          if [ "$RUNNER_OS" != macOS ]; then
            cargo packager -p nuprint-slint-demo --release --target "$TARGET" -f ${{ matrix.bundle }}
            exit 0
          fi
          cargo packager -p nuprint-slint-demo --release --target "$TARGET" -f app
          codesign --force --deep --sign - "$release/NuPrint Slint.app"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          arch=${TARGET%%-*}
          [ "$arch" = x86_64 ] && arch=x64
          mkdir -p target/slint-dmg
          cp -R "$release/NuPrint Slint.app" target/slint-dmg/
          ln -s /Applications target/slint-dmg/Applications
          hdiutil create -volname "NuPrint Slint" -srcfolder target/slint-dmg -ov -format UDZO \
            "$release/nuprint-slint_${version}_${arch}.dmg"

      - name: Stage
        shell: bash
        run: |
          mkdir dist
          release="target/${{ matrix.target }}/release"
          bundle="$release/bundle/${{ matrix.bundle }}"
          case "${{ matrix.bundle }}" in
            nsis) cp "$bundle"/*-setup.exe "$release"/nuprint-slint_*-setup.exe dist/ ;;
            dmg) cp "$bundle"/*.dmg "$release"/nuprint-slint_*.dmg dist/ ;;
            deb) cp "$bundle"/*.deb "$release"/nuprint-slint_*.deb dist/ ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  publish:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success' && (needs.release-please.outputs.created == 'true' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Attach and publish
        run: |
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
