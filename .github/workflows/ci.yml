name: CI

# Pull requests only: master moves by rebasing a pull request that already
# passed, so a run on the push would repeat the same checks.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same-repository pull requests from anyone but the maintainer (Renovate,
  # collaborators) wait here for a review. Forks and github-actions[bot]
  # already need a run approval from the repository settings.
  approval:
    name: Approval
    if: github.event.pull_request.user.login != 'wapenshaw' && github.event.pull_request.user.login != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci-approval
    steps:
      - run: echo "approved by a reviewer of the ci-approval environment"

  # Whether the pull request touches anything besides the website. A site-only
  # change skips the Rust, frontend and Python checks: the jobs still report, so
  # the required checks pass. It reads the file list from the API and runs no
  # pull request code, so it needs no approval.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename' > files.txt
          cat files.txt
          if grep -qvE '^(site/|\.github/workflows/site\.yml$)' files.txt; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: ${{ matrix.name }}
    needs: [approval, changes]
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') && needs.changes.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # Steps, not the job, skip a site-only change: a skipped matrix job reports
    # under its unexpanded name, so the required Linux, macOS and Windows
    # checks would never arrive.
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        if: env.CODE == 'true'

      - name: Linux system packages
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libfontconfig1-dev libxkbcommon-dev

      # rustup reads the pinned toolchain and components from rust-toolchain.toml.
      - name: Rust toolchain
        if: env.CODE == 'true'
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: env.CODE == 'true'

      - uses: actions/setup-node@v7
        if: env.CODE == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json

      # The Tauri host embeds the built frontend, so it must exist before Clippy compiles it.
      - name: Build frontend
        if: env.CODE == 'true'
        working-directory: apps/tauri
        run: |
          npm ci
          npm run build

      - name: Fetch PDFium
        if: env.CODE == 'true' && runner.os != 'Windows'
        run: ./scripts/fetch-pdfium.sh
      - name: Fetch PDFium
        if: env.CODE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Format
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        if: env.CODE == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: env.CODE == 'true'
        run: cargo test --workspace --locked
        env:
          # PDFium was fetched above, so a PDF test must not skip itself.
          NUPRINT_REQUIRE_PDFIUM: "1"

      # ts-rs regenerates the bindings during the tests; they must match what is committed.
      - name: Generated bindings are committed
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: git diff --exit-code -- apps/tauri/src/bindings

      - name: Whitespace
        if: env.CODE == 'true' && runner.os == 'Linux'
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  frontend:
    name: Frontend
    needs: [approval, changes]
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/tauri/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python-reference:
    name: Python reference
    needs: [approval, changes]
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') && needs.changes.outputs.code == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: poc/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --extra dev --locked
      - run: uv run --locked pytest -q
