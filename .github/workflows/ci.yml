name: CI

# Pull requests only: master moves by rebasing a pull request that already
# passed, so a run on the push would repeat the same checks.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same-repository pull requests from anyone but the maintainer (Renovate,
  # collaborators) wait here for a review. Forks and github-actions[bot]
  # already need a run approval from the repository settings.
  approval:
    name: Approval
    if: github.event.pull_request.user.login != 'wapenshaw' && github.event.pull_request.user.login != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ci-approval
    steps:
      - run: echo "approved by a reviewer of the ci-approval environment"

  rust:
    name: ${{ matrix.name }}
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-26.04
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libfontconfig1-dev libxkbcommon-dev

      # rustup reads the pinned toolchain and components from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # The Tauri host embeds the built frontend, so it must exist before Clippy compiles it.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Fetch PDFium
        if: runner.os != 'Windows'
        run: ./scripts/fetch-pdfium.sh
      - name: Fetch PDFium
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # ts-rs regenerates the bindings during the tests; they must match what is committed.
      - name: Generated bindings are committed
        if: runner.os == 'Linux'
        run: git diff --exit-code -- apps/desktop/src/bindings

      - name: Whitespace
        if: runner.os == 'Linux'
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  frontend:
    name: Frontend
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python-reference:
    name: Python reference
    needs: approval
    if: ${{ !cancelled() && (needs.approval.result == 'success' || needs.approval.result == 'skipped') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: poc/python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --extra dev --locked
      - run: uv run --locked pytest -q
