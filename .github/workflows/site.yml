name: Site

# Builds nuprint.app (site/) and deploys it to Cloudflare as a static-assets Worker.
# It runs when site/ changes on master, and release.yml calls it once a release is
# published, so the download links, the changelog, the user guide and the app's icon
# and screenshot move to the new version only after its installers are up. The pages
# name the latest published release; a draft never counts.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy nuprint.app
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits rather than cancelling a deploy halfway.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUPRINT_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          export NUPRINT_TAG
          # Its file names, so the page offers only the packages it has.
          NUPRINT_ASSETS="$(gh release view "$NUPRINT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          export NUPRINT_ASSETS
          # The user guide, icon and screenshot are built from the release, not from master.
          git fetch --no-tags --depth=1 origin "refs/tags/$NUPRINT_TAG:refs/tags/$NUPRINT_TAG"
          npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
