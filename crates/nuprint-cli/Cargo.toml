[package]
name = "nuprint-cli"
description = "NuPrint headless diagnostics and print entrypoint."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nuprint"
path = "src/main.rs"

[dependencies]
nuprint-core.workspace = true
nuprint-render.workspace = true
nuprint-protocol.workspace = true
nuprint-transport.workspace = true

anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
tracing-subscriber.workspace = true
uuid.workspace = true
