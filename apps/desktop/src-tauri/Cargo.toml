[package]
name = "nuprint-desktop"
description = "NuPrint desktop host: Tauri shell over the shared Rust application service."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "nuprint-desktop"

[lib]
name = "nuprint_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
nuprint-core.workspace = true
nuprint-render.workspace = true
nuprint-transport.workspace = true

serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.12.5", features = ["image-png"] }
tauri-plugin-dialog = "=2.8.4"
# Older tauri releases did not compile against newer sibling crates (semver-compatible on
# paper, API-incompatible in practice). Pin the exact family it was released with.
tauri-codegen = "=2.7.4"
tauri-macros = "=2.7.4"
tauri-runtime = "=2.12.2"
tauri-runtime-wry = "=2.12.3"
tauri-utils = "=2.10.2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# AppKit, to show the app icon chosen in the header in the Dock. The versions tauri already uses.
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData"] }
