[package]
name = "nuprint-slint"
description = "NuPrint front end written in Slint, driving the same application service as the Tauri app and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nuprint-slint"
path = "src/main.rs"

[dependencies]
nuprint-core.workspace = true
nuprint-render.workspace = true
nuprint-transport.workspace = true

base64 = "0.22"
cargo-packager-updater = "0.2.3"
image.workspace = true
# Checks the version an update was signed for, which cargo-packager-updater does not.
minisign-verify = "0.2.5"
# GTK dialogs on Linux, as the Tauri app's dialog plugin uses: rfd refuses to build with both GTK and
# its default XDG portal backend, which a workspace-wide build would otherwise ask for.
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde.workspace = true
serde_json.workspace = true
# Skia rasterises text with the platform's own engine (DirectWrite, Core Text, FreeType), as the
# Tauri app's web view does. `unstable-winit-030` gives access to window events (see main.rs).
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "accessibility", "compat-1-2", "unstable-winit-030"] }
tokio.workspace = true
uuid.workspace = true
webbrowser = "1.2"

[build-dependencies]
slint-build = "1.18.1"

# Installers built with cargo-packager (`cargo packager -p nuprint-slint --release`), as a
# preview beside the Tauri app's. Paths are relative to this folder. The release workflow stages
# the target's PDFium library and licence in target/slint-pdfium first; see docs/building.md.
[package.metadata.packager]
product-name = "NuPrint Slint"
identifier = "com.nuprint.slint"
description = "Print to small Bluetooth thermal printers (Slint preview)"
category = "Utility"
icons = [
    "../tauri/src-tauri/icons/32x32.png",
    "../tauri/src-tauri/icons/128x128.png",
    "../tauri/src-tauri/icons/128x128@2x.png",
    "../tauri/src-tauri/icons/icon.icns",
    "../tauri/src-tauri/icons/icon.ico",
]
resources = [{ src = "../../target/slint-pdfium", target = "pdfium" }]

[package.metadata.packager.macos]
minimum-system-version = "14.0"
# The Bluetooth permission prompt's wording, shared with the Tauri app.
info-plist-path = "../tauri/src-tauri/Info.plist"

[package.metadata.packager.deb]
depends = ["bluez", "libdbus-1-3", "libfontconfig1", "libfreetype6", "libgtk-3-0", "libxkbcommon0", "libxkbcommon-x11-0"]
